apply plugin: 'com.android.application'

android {
    namespace 'org.pocketworkstation.pckeyboard'
    compileSdk 36

    defaultConfig {
        applicationId 'org.pocketworkstation.pckeyboard'
        minSdk 24
        targetSdk 34
        versionCode 1041001
        versionName "v1.41.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        debugConfig {
            storeFile file("${rootDir}/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debugConfig
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        buildConfig true
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.15.0'
    testImplementation 'junit:junit:4.13.2'
}

tasks.register('syncCustomFonts', Copy) {
    from('src/main/res/fontFA') {
        into('fontFA')
    }
    from('src/main/res/fontEN') {
        into('fontEN')
    }
    into('src/main/assets')
}

preBuild.dependsOn syncCustomFonts