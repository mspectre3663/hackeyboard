name: Manual Build APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'نوع خروجی (Build Type)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - debug (امضا شده با کلید دیباگ - آماده نصب)
          - release-unsigned (خروجی Release کاملاً بدون امضا)

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        if: ${{ github.event.inputs.build_type == 'all' || contains(github.event.inputs.build_type, 'debug') }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Unsigned Release APK
        if: ${{ github.event.inputs.build_type == 'all' || contains(github.event.inputs.build_type, 'release') }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Debug APK Artifact
        if: ${{ github.event.inputs.build_type == 'all' || contains(github.event.inputs.build_type, 'debug') }}
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Unsigned Release APK Artifact
        if: ${{ github.event.inputs.build_type == 'all' || contains(github.event.inputs.build_type, 'release') }}
        uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned-apk
          path: app/build/outputs/apk/release/*.apk
